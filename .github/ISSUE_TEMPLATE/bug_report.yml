name: Bug Report
description: 报告一个 bug 以帮助我们改进
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 bug 报告！

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请描述你遇到的问题
      placeholder: 告诉我们你看到了什么
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: "例如: 3.9.7"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome
        - Safari (iOS)
        - Safari (macOS)
        - Edge
        - Firefox
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志输出
      description: 请粘贴相关的日志或错误信息
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 其他任何你认为有帮助的信息
