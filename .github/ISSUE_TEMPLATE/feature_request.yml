name: Feature Request
description: 建议一个新功能
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出新功能建议！

  - type: textarea
    id: problem
    attributes:
      label: 这个功能要解决什么问题？
      description: 清晰简洁地描述问题
      placeholder: 我总是感到沮丧，当...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方案
      description: 清晰简洁地描述你想要实现的功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 清晰简洁地描述你考虑过的其他解决方案

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 关于这个功能请求的其他信息或截图
