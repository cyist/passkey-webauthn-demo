name: Greet New Contributors

on:
  issues:
    types: [opened]
  pull_requests:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 感谢你创建了第一个 Issue！
            
            我们会尽快查看并回复。在此期间：
            - 确保你已经查看了 [FAQ](https://github.com/${{ github.repository }}/blob/main/docs/FAQ.md)
            - 提供尽可能多的信息以帮助我们理解问题
            
            再次感谢你的贡献！🎉
          pr-message: |
            🎉 感谢你的第一个 Pull Request！
            
            我们会尽快审查你的贡献。在此期间：
            - 确保你已经阅读了 [贡献指南](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)
            - 确保所有测试都通过
            - 耐心等待审查
            
            感谢你为项目做出贡献！✨
