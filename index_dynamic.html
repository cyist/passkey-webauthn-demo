<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey 测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .hostname-info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }

        .hostname-info strong {
            color: #667eea;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }

        .fingerprint-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 20px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fingerprint-icon">🔐</div>
        <h1>Passkey 测试</h1>
        <p class="subtitle" id="subtitle">正在加载配置...</p>
        
        <div class="hostname-info" id="hostnameInfo" style="display: none;">
            <strong>当前服务器:</strong> <span id="currentHostname">-</span>
        </div>

        <div class="input-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="输入用户名" autocomplete="username webauthn">
        </div>

        <button id="registerBtn" onclick="registerPasskey()" disabled>
            <span id="registerBtnText">注册 Passkey</span>
        </button>

        <div class="divider">或</div>

        <button id="loginBtn" onclick="authenticatePasskey()" disabled>
            <span id="loginBtnText">使用 Passkey 登录</span>
        </button>

        <div id="message" class="message"></div>
    </div>

    <!-- 动态加载配置 -->
    <script src="/config.js"></script>
    <script src="passkey.js"></script>
    <script>
        // 页面加载时获取服务器信息
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${config.apiUrl}/api`);
                const serverInfo = await response.json();
                
                document.getElementById('subtitle').textContent = serverInfo.name || 'WebAuthn 演示';
                document.getElementById('currentHostname').textContent = serverInfo.hostname + '.local';
                document.getElementById('hostnameInfo').style.display = 'block';
                
                // 启用按钮
                document.getElementById('registerBtn').disabled = false;
                document.getElementById('loginBtn').disabled = false;
                
                console.log('服务器信息:', serverInfo);
            } catch (error) {
                console.error('获取服务器信息失败:', error);
                document.getElementById('subtitle').textContent = '无法连接到服务器';
                showStatus('无法连接到服务器,请检查网络连接', 'error');
            }
        });
    </script>
</body>
</html>
